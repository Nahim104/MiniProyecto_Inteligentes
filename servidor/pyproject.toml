[project]
name = "servidor"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "python-multipart>=0.0.33",
    "torch>=2.15.0",
]

[project.scripts]
servidor = "servidor:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
